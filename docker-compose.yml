# Entorno de SIDAPA: aplicación web + PostgreSQL.
# El lector de facturas (sidapa-reader) es otro entorno: se levanta aparte con el docker-compose.yml de su repo.
# Todos los valores salen de .env (plantilla en .env.example); no se monta el secrets.json de user-secrets.
services:
  sidapa.presentation:
    build:
      context: .
      dockerfile: Dockerfile
    image: sidapa-presentation:latest
    container_name: sidapa-presentation
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Hora local de México: el panel de pedimentos calcula "hoy" con TimeProvider.GetLocalNow().
      TZ: America/Mexico_City
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?Falta JWT_KEY en .env}
      GoogleCloudStorage__BucketName: ${GCS_BUCKET_NAME:?Falta GCS_BUCKET_NAME en .env}
      # JSON del service account en Base64 (DependencyInjection.ResolveCredentialsJson lo decodifica).
      GoogleCloudStorage__CredentialsJson: ${GCS_CREDENTIALS_BASE64:?Falta GCS_CREDENTIALS_BASE64 en .env}
      # Opcional: contraseña de los usuarios de prueba <rol>@sidapa.local (solo Development).
      DevUsers__Password: ${DEV_USERS_PASSWORD:-}
      # Opcional: sin Email__Host / Email__From los correos solo se escriben en el log.
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__User: ${EMAIL_USER:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__From: ${EMAIL_FROM:-}
      # sidapa-reader corre en su propio entorno. Por defecto se busca publicado en el puerto 8000 del host;
      # si vive en otro servidor basta con cambiar TAXSCAN_BASE_URL en .env.
      TaxScan__BaseUrl: ${TAXSCAN_BASE_URL:-http://host.docker.internal:8000}
      # Aplica las migraciones de EF Core pendientes y los datos iniciales al arrancar (ver DatabaseMigrator).
      Database__MigrateOnStartup: "true"
    extra_hosts:
      # Hace que host.docker.internal resuelva también en Linux (Docker Desktop ya lo trae).
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sidapa-network

  db:
    image: postgres:16-alpine
    container_name: sidapa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # Volumen nombrado: persiste los datos de PostgreSQL fuera del
      # ciclo de vida del contenedor (sobrevive a `docker compose down`).
      - sidapa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - sidapa-network

volumes:
  sidapa-pgdata:

networks:
  sidapa-network:
    driver: bridge
